<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>СпортОбъекты</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        button {
            margin: 5px;
            cursor: pointer;
            padding: 5px 15px;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        .del {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        .link {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: #1d6fd1;
            font-size: inherit;
            text-align: left;
        }

        .link:hover {
            text-decoration: underline;
        }

        #status {
            margin: 8px 5px;
            color: #555;
        }

        .legend span {
            margin-right: 14px;
            white-space: nowrap;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        .map-wrap {
            position: relative;
        }

        #map {
            height: 560px;
        }

        /* карточка с информацией по клику на точку */
        .card {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 300px;
            max-width: calc(100% - 20px);
            background: #fff;
            z-index: 1000;
            border-radius: 10px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, .3);
            padding: 16px;
        }

        .card[hidden] {
            display: none;
        }

        .card h3 {
            margin: 0 28px 4px 0;
            word-break: break-word;
        }

        .card .muted {
            color: #6b7280;
            font-size: 13px;
        }

        .card .x {
            position: absolute;
            top: 8px;
            right: 8px;
            margin: 0;
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #f1f3f6;
            font-size: 18px;
            line-height: 1;
        }

        .card .r {
            margin-top: 10px;
            font-size: 14px;
            word-break: break-word;
        }

        .card a {
            color: #1d6fd1;
        }

        .card .del {
            margin: 14px 0 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Спортивные объекты</h2>
        <div>
            <button onclick="loadOsm()">🔄 Показать спортобъекты в этой области</button>
            <span id="status">Загрузка…</span>
        </div>
        <div class="map-wrap">
            <div id="map"></div>
            <div id="card" class="card" hidden></div>
        </div>
        <div class="legend" id="legend" style="margin:10px 0;"></div>

        <h3>Мои объекты (из базы)</h3>
        <div style="margin: 10px 0;">
            <input id="name" placeholder="Название">
            <input id="type" placeholder="Тип">
            <input id="lat" placeholder="Широта">
            <input id="lon" placeholder="Долгота">
            <button onclick="addObjects()" style="background-color: #4CAF50; color: white;">➕ Добавить</button>
        </div>
        <table border="1">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Тип</th>
                    <th>Широта</th>
                    <th>Долгота</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script>
        var map = null, osmLayer = null, markers = null, mapReady = false;
        var allObjects = [];

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        async function api(url, opts) {
            var res = await fetch(url, opts);
            var data = null;
            try { data = await res.json(); } catch (e) { }
            if (!res.ok) {
                var d = data && data.detail;
                throw new Error(typeof d === 'string' ? d : 'Ошибка запроса (' + res.status + ')');
            }
            return data;
        }

        function safeUrl(u) {
            u = String(u || '').trim();
            if (!u) return '';
            if (/^https?:\/\//i.test(u)) return u;
            return /^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u) ? 'https://' + u : '';
        }

        // ================= Карточка по клику на точку =================
        function row(label, html) {
            return '<div class="r"><span class="muted">' + label + ':</span> ' + html + '</div>';
        }

        function closeCard() { document.getElementById('card').hidden = true; }

        function showCard(html) {
            var c = document.getElementById('card');
            c.innerHTML = '<button class="x" onclick="closeCard()" title="Закрыть">×</button>' + html;
            c.hidden = false;
        }

        function openOwn(id) {
            var o = allObjects.find(function (x) { return x.id === id; });
            if (!o) return;
            showCard('<h3>' + esc(o.name) + '</h3><div class="muted">' + esc(o.type) + '</div>' +
                row('Широта', o.lat) + row('Долгота', o.lon) +
                '<button class="del" onclick="deleteObject(' + o.id + ')">🗑 Удалить</button>');
            if (mapReady) map.setCenter([o.lat, o.lon], Math.max(map.getZoom(), 15), { duration: 300 });
        }

        function openOsm(x) {
            var h = '<h3>' + esc(x.title) + '</h3><div class="muted"><i class="dot" style="background:' + esc(x.color) + '"></i>' + esc(x.kind) + '</div>';
            if (x.sports) h += row('Спорт', esc(x.sports));
            if (x.address) h += row('Адрес', esc(x.address));
            if (x.hours) h += row('Часы работы', esc(x.hours));
            if (x.phone) h += row('Телефон', esc(x.phone));
            var url = safeUrl(x.website);
            if (url) h += row('Сайт', '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(x.website) + '</a>');
            h += row('Координаты', x.lat.toFixed(5) + ', ' + x.lon.toFixed(5));
            showCard(h);
        }

        // ================= Спортобъекты из OpenStreetMap =================
        var LEISURE = {
            pitch: { ru: 'Спортплощадка', color: '#2e9e44' },
            sports_centre: { ru: 'Спортцентр', color: '#1d6fd1' },
            stadium: { ru: 'Стадион', color: '#d12f2f' },
            fitness_centre: { ru: 'Фитнес-центр', color: '#8e44ad' },
            swimming_pool: { ru: 'Бассейн', color: '#17a2b8' },
            track: { ru: 'Беговая дорожка', color: '#e67e22' },
            ice_rink: { ru: 'Каток', color: '#5dade2' },
            golf_course: { ru: 'Гольф', color: '#6c8f1e' },
            fitness_station: { ru: 'Уличные тренажёры', color: '#c0392b' }
        };
        var OTHER = { ru: 'Спортивный объект', color: '#555555' };
        var SPORT_RU = {
            soccer: 'футбол', football: 'футбол', basketball: 'баскетбол', tennis: 'теннис',
            volleyball: 'волейбол', swimming: 'плавание', running: 'бег', athletics: 'лёгкая атлетика',
            ice_hockey: 'хоккей', hockey: 'хоккей', table_tennis: 'настольный теннис',
            skateboard: 'скейтбординг', gymnastics: 'гимнастика', boxing: 'бокс',
            fitness: 'фитнес', yoga: 'йога', badminton: 'бадминтон', handball: 'гандбол',
            climbing: 'скалолазание', golf: 'гольф', multi: 'разные виды спорта',
            skiing: 'лыжи', cycling: 'велоспорт', martial_arts: 'единоборства'
        };
        function sportsText(tags) {
            if (!tags.sport) return '';
            return tags.sport.split(';').map(function (s) { s = s.trim(); return SPORT_RU[s] || s; }).join(', ');
        }

        (function () {
            var html = '';
            for (var k in LEISURE) {
                html += '<span><i class="dot" style="background:' + LEISURE[k].color + '"></i>' + LEISURE[k].ru + '</span>';
            }
            html += '<span><i class="dot" style="background:' + OTHER.color + '"></i>Другое</span>';
            html += '<span><i class="dot" style="background:#1e98ff"></i>Мои объекты</span>';
            document.getElementById('legend').innerHTML = html;
        })();

        var MIN_ZOOM = 14, LIMIT = 300, osmAbort = null, osmTimer = null;

        var OVERPASS = [
            'https://overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter',
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
            'https://overpass.private.coffee/api/interpreter',
            'https://overpass.openstreetmap.fr/api/interpreter'
        ];

        async function overpassFetch(query, signal) {
            var lastError;
            for (var i = 0; i < OVERPASS.length; i++) {
                var ctrl = new AbortController();
                var timer = setTimeout(function () { ctrl.abort(); }, 12000);
                signal.addEventListener('abort', function () { ctrl.abort(); });
                try {
                    var res = await fetch(OVERPASS[i], {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'data=' + encodeURIComponent(query),
                        signal: ctrl.signal
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                } catch (e) {
                    if (signal.aborted) throw e;
                    lastError = e.name === 'AbortError' ? new Error('таймаут') : e;
                } finally {
                    clearTimeout(timer);
                }
            }
            throw lastError;
        }

        async function loadOsm() {
            var status = document.getElementById('status');
            if (!mapReady) return;

            if (map.getZoom() < MIN_ZOOM) {
                status.textContent = 'Приблизьте карту (масштаб ' + MIN_ZOOM + ' и больше), чтобы загрузить спортобъекты';
                return;
            }

            var b = map.getBounds();   // [[юг, запад], [север, восток]]
            var bbox = [b[0][0], b[0][1], b[1][0], b[1][1]].join(',');
            var leisureRe = Object.keys(LEISURE).join('|');
            var query = '[out:json][timeout:15];(' +
                'nwr["leisure"~"^(' + leisureRe + ')$"](' + bbox + ');' +
                'nwr["sport"](' + bbox + ');' +
                ');out center ' + LIMIT + ';';

            if (osmAbort) osmAbort.abort();
            osmAbort = new AbortController();
            status.textContent = 'Ищу спортобъекты на карте…';

            try {
                var data = await overpassFetch(query, osmAbort.signal);

                osmLayer.removeAll();
                var count = 0;

                data.elements.forEach(function (el) {
                    var lat = el.lat !== undefined ? el.lat : (el.center && el.center.lat);
                    var lon = el.lon !== undefined ? el.lon : (el.center && el.center.lon);
                    if (lat === undefined || lon === undefined) return;

                    var tags = el.tags || {};
                    var kind = LEISURE[tags.leisure] || OTHER;
                    var title = tags.name || tags['name:ru'] || kind.ru;
                    var street = tags['addr:street'] ? tags['addr:street'] + (tags['addr:housenumber'] ? ', ' + tags['addr:housenumber'] : '') : '';
                    var info = {
                        title: title, kind: kind.ru, color: kind.color,
                        sports: sportsText(tags), lat: lat, lon: lon,
                        address: [tags['addr:city'], street].filter(Boolean).join(', '),
                        phone: tags.phone || tags['contact:phone'] || '',
                        hours: tags.opening_hours || '',
                        website: tags.website || tags['contact:website'] || ''
                    };

                    var pm = new ymaps.Placemark([lat, lon],
                        { hintContent: title },
                        { preset: 'islands#circleDotIcon', iconColor: kind.color, hasBalloon: false });
                    pm.events.add('click', function () { openOsm(info); });
                    osmLayer.add(pm);
                    count++;
                });

                status.textContent = 'Найдено на карте: ' + count +
                    (data.elements.length >= LIMIT ? ' (показаны первые ' + LIMIT + ', приблизьте карту)' : '');
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error('Ошибка Overpass:', error);
                status.textContent = 'Не удалось загрузить объекты с карты (' + error.message + '). Попробуйте ещё раз.';
            }
        }

        // ================= Мои объекты из базы =================
        async function loadData() {
            try {
                allObjects = await api('/api/objects');
                if (mapReady) markers.removeAll();
                var html = '';

                allObjects.forEach(function (o) {
                    if (mapReady) {
                        var pm = new ymaps.Placemark([o.lat, o.lon],
                            { hintContent: o.name },
                            { preset: 'islands#blueSportIcon', hasBalloon: false });
                        pm.events.add('click', function () { openOwn(o.id); });
                        markers.add(pm);
                    }
                    html += '<tr>' +
                        '<td><button class="link" onclick="openOwn(' + o.id + ')">' + esc(o.name) + '</button></td>' +
                        '<td>' + esc(o.type) + '</td>' +
                        '<td>' + o.lat + '</td>' +
                        '<td>' + o.lon + '</td>' +
                        '<td><button class="del" onclick="deleteObject(' + o.id + ')">🗑 Удалить</button></td>' +
                        '</tr>';
                });

                document.getElementById('list').innerHTML = html || '<tr><td colspan="5">Нет объектов</td></tr>';
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('list').innerHTML =
                    '<tr><td colspan="5">База недоступна (откройте страницу через сервер: http://127.0.0.1:8000/)</td></tr>';
            }
        }

        async function addObjects() {
            var data = {
                name: document.getElementById('name').value.trim(),
                type: document.getElementById('type').value.trim(),
                lat: parseFloat(document.getElementById('lat').value.replace(',', '.')),
                lon: parseFloat(document.getElementById('lon').value.replace(',', '.'))
            };

            if (!data.name || !data.type || isNaN(data.lat) || isNaN(data.lon)) {
                alert('❌ Заполните все поля!');
                return;
            }

            try {
                await api('/api/objects/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                ['name', 'type', 'lat', 'lon'].forEach(function (id) { document.getElementById(id).value = ''; });
                alert('✅ Объект добавлен!');
                loadData();
            } catch (error) {
                alert('❌ ' + error.message);
            }
        }

        async function deleteObject(id) {
            if (!confirm('Удалить объект?')) return;
            try {
                await api('/api/objects/' + id, { method: 'DELETE' });
                closeCard();
                loadData();
            } catch (error) {
                alert('❌ ' + error.message);
            }
        }

        // ================= Запуск =================
        ymaps.ready(function () {
            map = new ymaps.Map('map', {
                center: [55.75, 37.62],   // [широта, долгота]
                zoom: 14,
                controls: ['zoomControl', 'typeSelector', 'fullscreenControl']
            });
            osmLayer = new ymaps.GeoObjectCollection();
            markers = new ymaps.GeoObjectCollection();
            map.geoObjects.add(osmLayer);
            map.geoObjects.add(markers);
            mapReady = true;

            // Автообновление при сдвиге/масштабировании карты
            map.events.add('boundschange', function () {
                clearTimeout(osmTimer);
                osmTimer = setTimeout(loadOsm, 700);
            });

            loadData();
            loadOsm();
        });
    </script>
</body>

</html>
